# Render's free tier spins the API down after ~15 idle minutes, and the next visitor then waits up
# to a minute for it to boot. Pinging the health URL every 10 minutes keeps it warm.
# GitHub may delay scheduled runs by a few minutes; that is fine for this purpose.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "https://online-food-ordering-a8ys.onrender.com/api/restaurants")
          echo "API answered with HTTP $code"
          test "$code" = "200"
