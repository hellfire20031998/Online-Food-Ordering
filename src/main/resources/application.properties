spring.application.name=Online-Food-Ordering

# Optionally load local overrides from backend/.env (gitignored; see .env.example).
# Real OS environment variables still take precedence over values from this file.
spring.config.import=optional:file:.env[.properties]

# Bind to the port the host provides (Render/Heroku set PORT)
server.port=${PORT:8080}

# Common JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Database configuration (override via environment variables; defaults are for local dev only).
# The JDBC driver is inferred from the URL, so both MySQL (local) and PostgreSQL (Render/Neon) work.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/my_restaurant}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# Keep the connection pool small for free-tier databases
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JWT (set JWT_SECRET in every non-local environment; the fallback is for local dev only)
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (comma-separated origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Platform team bootstrap: the first TEAM_ADMIN is created at startup when both values are set.
# Further team members are created from the team console.
team.admin.name=${TEAM_ADMIN_NAME:Platform Admin}
team.admin.email=${TEAM_ADMIN_EMAIL:}
team.admin.password=${TEAM_ADMIN_PASSWORD:}

# Platform defaults; the commission is editable by TEAM_ADMIN / TEAM_MANAGER from the team console.
platform.default-commission-percentage=${PLATFORM_DEFAULT_COMMISSION:10}
platform.currency=INR

# Public site URL used in emails
app.name=${APP_NAME:Foodiyapa}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Encryption of bank account data at rest (AES-256-GCM).
#  - DATA_ENCRYPTION_KEY: random string of at least 32 chars, unique per environment, never committed.
#  - To rotate: move the old value into DATA_ENCRYPTION_PREVIOUS_KEYS (comma-separated), set a new
#    DATA_ENCRYPTION_KEY, restart, then run "Re-encrypt" from the team console (Settings > Security).
#  - ENFORCE_STRONG_ENCRYPTION_KEY=true makes startup fail on a weak or default key; set it in production.
app.encryption.key=${DATA_ENCRYPTION_KEY:local-dev-only-encryption-key-change-me-0123456789}
app.encryption.previous-keys=${DATA_ENCRYPTION_PREVIOUS_KEYS:}
app.encryption.enforce-strong-key=${ENFORCE_STRONG_ENCRYPTION_KEY:false}

# Online payments. gateway = none (default: cash on delivery only) | stripe | razorpay (not implemented yet)
app.payments.gateway=${PAYMENT_GATEWAY:none}
app.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payments.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Email. provider = log (default, prints to the log) | smtp (Gmail, Amazon SES SMTP, any relay) | resend
app.email.provider=${EMAIL_PROVIDER:log}
app.email.from=${EMAIL_FROM:Foodiyapa <no-reply@example.com>}
app.email.resend.api-key=${RESEND_API_KEY:}
# SMTP settings (Gmail: smtp.gmail.com:587 + App Password. SES: email-smtp.<region>.amazonaws.com:587 + SMTP credentials)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Logging (can be tuned per profile)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
