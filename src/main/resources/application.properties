spring.application.name=Online-Food-Ordering

# Common JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Database configuration (override via environment variables; defaults are for local dev only)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/my_restaurant}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT (set JWT_SECRET in every non-local environment; the fallback is for local dev only)
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (comma-separated origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging (can be tuned per profile)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
